<html>
    <head> Calculator </head>
    <body>
        <input id="val1" />
        <input id="val2" />
        <br>
        <button id="add button">Add</button>
        <p id="result">    </p>
    </body>

    <!.. to give functionality by js ..>
    <script>
        //add pannanum nu funtion okk..adhukana event create pannnum
        document.getElementById("add button").onclick= add2numbers;

        function add2numbers()
        {
            let a=document.getElementById("val1").value;
            let b=document.getElementById("val2").value;
            let res=parseInt(a)+parseInt(b)
            /*to convert text to numner by using parseInt keyword.*/
            document.getElementById("Result").innerHTML=res;
        }

        
    </script>
</html>
